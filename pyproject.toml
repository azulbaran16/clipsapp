[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "clipperkick"
dynamic = ["version"]
description = "Aplicación de escritorio para detectar momentos intensos y crear clips de directos."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "yt-dlp[default,curl-cffi]>=2025.1.15",
]

[project.gui-scripts]
clipperkick = "clipperkick.ui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "clipperkick.__version__"}
